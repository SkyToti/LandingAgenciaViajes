name: Publicar en GitHub Pages

# Publica ÚNICAMENTE el contenido de public/.
# La documentación del proyecto (docs/, prototipo/) permanece en el
# repositorio pero nunca llega al sitio publicado.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar solo la carpeta public
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4
